name: Build OSEN TURBOPLAY Admin Panel
on:
  push:
    branches: [admin-panel]
    paths:
      - 'admin-panel/**'
      - '.github/workflows/admin-panel-build.yml'
  pull_request:
    branches: [admin-panel]
    paths:
      - 'admin-panel/**'
      - '.github/workflows/admin-panel-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-panel/package.json
      - run: npm install
      - run: npm run build
