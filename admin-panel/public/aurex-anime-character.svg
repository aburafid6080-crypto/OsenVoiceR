<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">OSEN BOOSTVOX RX anime mascots</title><desc id="desc">Original silver-haired anime hero with violet eyes and a small companion cat, surrounded by violet and blue energy.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080817"/><stop offset=".55" stop-color="#1b1040"/><stop offset="1" stop-color="#071b32"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#9d55ff" stop-opacity=".72"/><stop offset="1" stop-color="#5423a8" stop-opacity="0"/></radialGradient>
 <linearGradient id="hair" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset=".4" stop-color="#c9c7ff"/><stop offset="1" stop-color="#7164b8"/></linearGradient>
 <linearGradient id="coat" x2="1" y2="1"><stop stop-color="#40217c"/><stop offset=".5" stop-color="#14152f"/><stop offset="1" stop-color="#070c1c"/></linearGradient>
 <linearGradient id="gold"><stop stop-color="#ffe58b"/><stop offset="1" stop-color="#b97a22"/></linearGradient>
 <linearGradient id="cat"><stop stop-color="#fff"/><stop offset="1" stop-color="#a8a4c7"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
 <filter id="shine"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
